name: Release label
description: Resolve a PR's release label into a semver bump, or a decision not to release.

# A composite action rather than shared workflow shell, because `uses: ./...`
# inside a reusable workflow resolves against the CALLER's checkout, not this
# repo. A composite action referenced as
# jcwearn/workflows/.github/actions/release-label@v1 brings its own files, so
# $GITHUB_ACTION_PATH always points at the script next to this file.

inputs:
  labels:
    description: "JSON array of the PR's label names, e.g. toJson(github.event.pull_request.labels.*.name)"
    required: true

outputs:
  release:
    description: "true when a version should be cut, false for release:skip"
    value: ${{ steps.decide.outputs.release }}
  bump:
    description: "major, minor, patch, or skip"
    value: ${{ steps.decide.outputs.bump }}

runs:
  using: composite
  steps:
    - id: decide
      shell: bash
      env:
        LABELS: ${{ inputs.labels }}
      run: |
        set -euo pipefail
        "$GITHUB_ACTION_PATH/release-label.sh" >> "$GITHUB_OUTPUT"
