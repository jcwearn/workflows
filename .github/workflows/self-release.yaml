name: Release

# workflows releasing itself with the reusable workflow it hosts.
#
# `uses: ./...` is a same-repo local reference, and it resolves against the
# commit that triggered this run -- for a pull_request event, the merge ref,
# which contains the PR's own changes. So a PR that edits release.yaml is
# released BY the edited release.yaml. That is the dogfooding, and it is also
# the hazard: merge a broken release.yaml and it cannot cut its own fix.
# ci.yaml runs first for that reason, and RUNBOOK.md records the manual
# tag-and-release commands for when it still goes wrong.

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  verify:
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/ci.yaml

  # `image` is left unset: this repo builds nothing, so the git ref IS the
  # artifact. That is also why move-major-tag is on here and off by default
  # everywhere else -- consumers pin a digest resolved from v1, and Renovate
  # follows that moving tag to notice a release and open the bump PR.
  release:
    needs: verify
    if: github.event.pull_request.merged == true
    permissions:
      contents: write
    uses: ./.github/workflows/release.yaml
    with:
      move-major-tag: true
