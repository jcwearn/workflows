name: Probe tag API

# THROWAWAY. Delete this file in the PR that acts on its result.
#
# Release run 32492220999 failed with:
#
#   ! [remote rejected] v1.7.3 -> v1.7.3 (refusing to allow a GitHub App to
#     create or update workflow `.github/workflows/cloudflare-pages-deploy.yaml`
#     without `workflows` permission)
#
# PRs #24 and #23 merged 25s apart and both touched that workflow file, so by
# the time #24's release pushed its tag, main had already moved past the commit
# being tagged. GITHUB_TOKEN is a GitHub App token and `workflows` is not a
# scope `permissions:` can grant -- there is no `permissions: workflows: write`.
#
# The intended fix is to create tags through the REST refs API instead of
# `git push`, on the theory that the restriction lives in the git receive path
# and a ref pointing at an already-existing commit introduces no new blobs.
# That is a prior, not a fact, and release.yaml cannot cut its own fix if it is
# wrong -- so this proves it first, under a plain `contents: write` token.
#
# A local probe would prove nothing: this account's gh CLI token already
# carries `workflow` scope.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      # The exact commit that broke the release: its copy of
      # cloudflare-pages-deploy.yaml differs from the one on main's tip.
      STALE_SHA: d967231c51a2f0373b06c20292d1ebdb7a686fc9
      CREATE_REF: probe-api-annotated
      MOVE_REF: probe-api-moving
    steps:
      # No checkout. gh talks to the API, and needing no working tree is half
      # the point -- the real fix drops the only persist-credentials: true in
      # the repo along with the push.
      - name: Create an annotated tag at the stale commit
        run: |
          set -euo pipefail
          # Two calls, matching `git tag -a`: an annotated tag OBJECT, then a
          # ref pointing at that object rather than at the commit.
          tag_sha=$(gh api "repos/${GH_REPO}/git/tags" \
            -f tag="$CREATE_REF" \
            -f message="probe" \
            -f object="$STALE_SHA" \
            -f type=commit \
            --jq .sha)
          echo "tag object: ${tag_sha}"

          gh api "repos/${GH_REPO}/git/refs" \
            -f ref="refs/tags/${CREATE_REF}" \
            -f sha="$tag_sha" \
            --jq '"created \(.ref) -> \(.object.sha)"'

      - name: Force-move a tag onto the stale commit
        run: |
          set -euo pipefail
          # What move-major-tag does to v1. Never probed against the real v1.
          head_sha=$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq .object.sha)

          tag_sha=$(gh api "repos/${GH_REPO}/git/tags" \
            -f tag="$MOVE_REF" -f message="probe" \
            -f object="$head_sha" -f type=commit --jq .sha)
          gh api "repos/${GH_REPO}/git/refs" \
            -f ref="refs/tags/${MOVE_REF}" -f sha="$tag_sha" --jq .ref

          moved_sha=$(gh api "repos/${GH_REPO}/git/tags" \
            -f tag="$MOVE_REF" -f message="probe moved" \
            -f object="$STALE_SHA" -f type=commit --jq .sha)
          gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/${MOVE_REF}" \
            -f sha="$moved_sha" -F force=true \
            --jq '"moved \(.ref) -> \(.object.sha)"'

      # always(): a probe that fails halfway must still not leave refs behind.
      - name: Clean up
        if: always()
        run: |
          set -uo pipefail
          for ref in "$CREATE_REF" "$MOVE_REF"; do
            if gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${ref}" --silent; then
              echo "deleted ${ref}"
            else
              echo "nothing to delete for ${ref}"
            fi
          done
