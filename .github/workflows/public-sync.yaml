name: Public Sync

# Publishes a filtered snapshot of a private repo to a public counterpart.
#
# The target repo only ever receives file trees -- never commits, branches, or
# refs from the source. Its history is an independent linear series of "sync:"
# commits, so private history cannot leak even if the source is later rewritten.

on:
  workflow_call:
    inputs:
      target-repo:
        description: "owner/repo of the public counterpart, e.g. jcwearn/foo-public"
        required: true
        type: string
      ignore-file:
        description: "rsync exclude-from file, relative to the source repo root"
        required: false
        default: .publicignore
        type: string
      readme-override:
        description: "Path in the source repo to publish as the target's README.md"
        required: false
        default: ""
        type: string
      message-mode:
        description: >-
          passthrough: replay upstream commit messages onto the public commit.
          generic: opaque "sync: <short-sha>" only. Use generic when upstream
          commit messages discuss things you would rather not publish.
        required: false
        default: passthrough
        type: string
      gitleaks-version:
        description: "Pinned gitleaks release used for the pre-push secret scan"
        required: false
        default: "8.30.1"
        type: string
      gitleaks-sha256:
        description: "sha256 of gitleaks_<version>_linux_x64.tar.gz"
        required: false
        default: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        type: string
      signer-name:
        description: >-
          Committer name used when SIGNING_KEY is set. The author comes from
          the upstream commit; only the committer changes.
        required: false
        default: ""
        type: string
      signer-email:
        description: >-
          Committer email used when SIGNING_KEY is set. Must be an email GitHub
          associates with the account owning the key, or the commit shows as
          unverified. A <id>+<login>@users.noreply.github.com address works and
          avoids publishing a real address.
        required: false
        default: ""
        type: string
    secrets:
      DEPLOY_KEY:
        description: "SSH private key with write access to target-repo"
        required: true
      SIGNING_KEY:
        description: >-
          SSH private key registered on the account as a *signing* key (not an
          authentication key -- an auth key silently fails to verify). Optional:
          without it, commits are pushed unsigned.
        required: false

permissions:
  contents: read

concurrency:
  group: public-sync-${{ inputs.target-repo }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync to ${{ inputs.target-repo }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source (private)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          path: source
          persist-credentials: false
          # Full history so commit messages since the last sync can be replayed
          fetch-depth: 0

      - name: Check out target (public)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: ${{ inputs.target-repo }}
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          path: target

      - name: Render public tree
        env:
          IGNORE_FILE: ${{ inputs.ignore-file }}
          README_OVERRIDE: ${{ inputs.readme-override }}
        run: |
          set -euo pipefail

          exclude_args=()
          if [ -n "$IGNORE_FILE" ]; then
            if [ -f "source/$IGNORE_FILE" ]; then
              exclude_args+=("--exclude-from=source/$IGNORE_FILE")
              echo "Using ignore file: $IGNORE_FILE"
            else
              echo "::error::ignore-file '$IGNORE_FILE' not found in source repo."
              echo "Refusing to publish an unfiltered tree. Create it or pass ignore-file: ''."
              exit 1
            fi
          else
            echo "::warning::No ignore file configured -- publishing the entire tracked tree."
          fi

          # --exclude=.git/ applies to both sides, which is also what protects
          # target/.git from --delete. Do not remove it.
          rsync -a --delete \
            --exclude=.git/ \
            "${exclude_args[@]}" \
            source/ target/

          if [ -n "$README_OVERRIDE" ]; then
            if [ ! -f "source/$README_OVERRIDE" ]; then
              echo "::error::readme-override '$README_OVERRIDE' not found in source repo."
              exit 1
            fi
            cp "source/$README_OVERRIDE" target/README.md
            echo "Applied README override from $README_OVERRIDE"
          fi

      - name: Scan rendered tree for secrets
        env:
          VERSION: ${{ inputs.gitleaks-version }}
          SHA256: ${{ inputs.gitleaks-sha256 }}
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

          # Scans exactly what is about to be published, after filtering.
          # --redact keeps findings out of the log. A repo may ship its own
          # .gitleaks.toml, which gitleaks picks up from the scanned directory.
          if ! ./gitleaks dir target --redact --no-banner --exit-code 1 \
                 --report-format json --report-path gitleaks-report.json; then
            echo "::error::Secret scan failed -- nothing was pushed."
            echo "Findings (redacted):"
            jq -r '.[] | "  \(.RuleID)  \(.File):\(.StartLine)"' gitleaks-report.json
            echo ""
            echo "Investigate before retrying. If a finding is a false positive,"
            echo "add a .gitleaks.toml allowlist to the source repo -- do not"
            echo "bypass this step."
            exit 1
          fi
          echo "Secret scan clean."

      - name: Commit and push
        env:
          SOURCE_SHA: ${{ github.sha }}
          TARGET_REPO: ${{ inputs.target-repo }}
          MESSAGE_MODE: ${{ inputs.message-mode }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNER_NAME: ${{ inputs.signer-name }}
          SIGNER_EMAIL: ${{ inputs.signer-email }}
        run: |
          set -euo pipefail

          # Fail rather than defaulting: a typo silently falling back to
          # passthrough would publish more than intended, not less.
          case "$MESSAGE_MODE" in
            passthrough|generic) ;;
            *) echo "::error::message-mode must be 'passthrough' or 'generic', got '$MESSAGE_MODE'."; exit 1 ;;
          esac

          # Defaults. The author is overridden further down when everything in
          # scope shares one upstream author; this stands as the fallback for a
          # mixed batch, and as the committer when no signing key is supplied.
          git -C target config user.name "github-actions[bot]"
          git -C target config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Signing is optional so repos that have not been set up still sync.
          # When a key IS supplied, refuse to fall back to an unsigned push:
          # quietly publishing unsigned after signing was configured is the
          # wrong direction to fail.
          if [ -n "$SIGNING_KEY" ]; then
            if [ -z "$SIGNER_EMAIL" ]; then
              echo "::error::SIGNING_KEY is set but signer-email is empty."
              echo "GitHub matches a signature to the account by *committer* email,"
              echo "so an unset address would push a commit that never verifies."
              exit 1
            fi
            install -m 600 /dev/null signing-key
            printf '%s\n' "$SIGNING_KEY" > signing-key
            git -C target config gpg.format ssh
            git -C target config user.signingkey "$(pwd)/signing-key"
            git -C target config commit.gpgsign true
            # Committer (not author) is the identity GitHub verifies against.
            export GIT_COMMITTER_NAME="${SIGNER_NAME:-$SIGNER_EMAIL}"
            export GIT_COMMITTER_EMAIL="$SIGNER_EMAIL"
            echo "Signing as ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>."
          else
            # Explicit rather than assumed: the checkout is fresh so this is
            # already the default, but it keeps the unsigned path independent of
            # any ambient git config on the runner.
            git -C target config commit.gpgsign false
            echo "No SIGNING_KEY supplied -- commit will be unsigned."
          fi

          git -C target add -A

          if git -C target diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          # Where the last sync left off, recorded as a trailer on the target's
          # most recent commit. Survives failed runs: if two pushes land before a
          # successful sync, both are described in the next commit message.
          last=$(git -C target log -1 --format=%B 2>/dev/null \
                   | sed -n 's/^Source-commit: //p' | tail -1 || true)

          range=""
          if [ -n "$last" ] && git -C source cat-file -e "${last}^{commit}" 2>/dev/null; then
            if [ "$(git -C source rev-list --count "${last}..HEAD")" -gt 0 ]; then
              range="${last}..HEAD"
            fi
          fi

          # Subject and body come from the newest non-merge commit in scope. For a
          # merged feature branch that is the actual work, not "Merge pull request
          # #NN", which points at a PR nobody outside the private repo can open.
          if [ -n "$range" ]; then
            subject=$(git -C source log --no-merges -1 --format=%s "$range" 2>/dev/null || true)
            body=$(git -C source log --no-merges -1 --format=%b "$range" 2>/dev/null || true)
          else
            subject=$(git -C source log --no-merges -1 --format=%s 2>/dev/null || true)
            body=$(git -C source log --no-merges -1 --format=%b 2>/dev/null || true)
          fi
          [ -n "$subject" ] || subject=$(git -C source log -1 --format=%s "$SOURCE_SHA")
          [ -n "$subject" ] || subject="sync"

          # Credit whoever wrote the work, so a Renovate bump publishes as
          # Renovate rather than as the sync bot. The committer stays the signer:
          # GitHub matches a signature to an account by committer email, so this
          # cannot affect the Verified badge.
          #
          # Only when everything in scope shares one author. A batch spanning
          # several people is genuinely collective, and crediting the newest
          # commit's author would hand one person the rest of the work. Leaving
          # the variables unset falls back to the git config set above, which is
          # the bot -- so the mixed case needs no branch of its own.
          #
          # Scope matches the message exactly, including the empty-range case on
          # a first sync, where the message comes from a single commit and so
          # does the author.
          if [ -n "$range" ]; then
            author_count=$(git -C source log --no-merges --format='%ae' "$range" 2>/dev/null | sort -u | wc -l | tr -d ' ')
          else
            author_count=1
          fi
          if [ "$author_count" = "1" ]; then
            GIT_AUTHOR_NAME=$(git -C source log --no-merges -1 --format=%an ${range:+"$range"} 2>/dev/null || true)
            GIT_AUTHOR_EMAIL=$(git -C source log --no-merges -1 --format=%ae ${range:+"$range"} 2>/dev/null || true)
            if [ -n "$GIT_AUTHOR_NAME" ] && [ -n "$GIT_AUTHOR_EMAIL" ]; then
              export GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL
              echo "Authoring as ${GIT_AUTHOR_NAME} <${GIT_AUTHOR_EMAIL}>."
            fi
          else
            echo "Range spans ${author_count} authors; authoring as the bot."
          fi

          if [ "$MESSAGE_MODE" = "generic" ]; then
            subject="sync: ${SOURCE_SHA:0:7}"
            body=""
            range=""
          fi

          {
            printf '%s\n' "$subject"
            if [ -n "$body" ]; then
              printf '\n%s\n' "$body"
            fi
            if [ -n "$range" ]; then
              n=$(git -C source log --no-merges --oneline "$range" | wc -l | tr -d ' ')
              if [ "$n" -gt 1 ]; then
                printf '\nSynced %s upstream commits:\n' "$n"
                # Bare short SHAs on purpose -- an owner/repo@sha reference would
                # be auto-linkified into a link that 404s without private access.
                git -C source log --no-merges --format='- %h %s' "$range"
              fi
            fi
            printf '\nSource-commit: %s\n' "$SOURCE_SHA"
          } > commit-message.txt

          # Messages are a leak path the tree scan cannot see, so gate them too.
          if ! ./gitleaks stdin --redact --no-banner --exit-code 1 < commit-message.txt; then
            echo "::error::Secret detected in the composed commit message -- nothing was pushed."
            echo "Rewrite the offending upstream commit message, or set message-mode: generic."
            exit 1
          fi

          git -C target commit -q -F "$(pwd)/commit-message.txt"

          if [ -n "$SIGNING_KEY" ]; then
            # Confirm a signature actually attached, by looking for the header on
            # the raw commit object. Deliberately not `git verify-commit`: for SSH
            # signatures that needs a gpg.ssh.allowedSignersFile we do not have,
            # and would fail on a perfectly good signature. GitHub does the real
            # verification server-side against the registered key.
            if ! git -C target cat-file commit HEAD | grep -q '^gpgsig'; then
              echo "::error::Signing was configured but HEAD carries no signature."
              exit 1
            fi
            echo "Commit is signed."
          fi

          git -C target push
          echo "Published ${SOURCE_SHA:0:7} to ${TARGET_REPO}:"
          echo "  $subject"

      - name: Remove signing key
        if: always()
        run: rm -f signing-key
