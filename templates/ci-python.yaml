name: CI

# Copy to .github/workflows/ci.yml in a Python repo.
#
# Before this works, the repo must satisfy the contract python-ci.yaml relies
# on:
#
#   .python-version       the interpreter, tracking what the repo's CONTAINER
#                         runs rather than the newest release -- check with
#                         `docker run --rm <base image> python -V`
#   requirements.txt      runtime dependencies
#   requirements-dev.txt  starting `-r requirements.txt`, and pinning ruff and
#                         pytest exactly
#   ruff.toml             not pyproject.toml, unless the repo really is a
#                         package
#   tests                 discoverable by pytest from the repo root

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    # Explicit even though `read` is all python-ci needs and all this account
    # grants by default. A reusable workflow can only narrow what the caller
    # granted, so the grant belongs here where it is visible.
    permissions:
      contents: read
    # Renovate pins this to a digest on its next run, leaving `# v1` behind as
    # the record of what to follow. Write `@v1` with no trailing comment; the
    # comment belongs on a digest, where it says which tag the digest came
    # from. See the repo README for what counts as breaking.
    uses: jcwearn/workflows/.github/workflows/python-ci.yaml@v1
    # The only input is optional; delete this block if the default suits.
    with:
      # Default is 10. Raise it for a suite that drives a browser or talks to a
      # real service.
      timeout-minutes: 10
