name: Publish Public Snapshot

# Copy to .github/workflows/publish.yaml in a private repo.
# Replace <REPO>-public with the target, and add the PUBLIC_SYNC_DEPLOY_KEY secret.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    # Explicit even though `read` is all public-sync needs and all this account
    # grants by default. A reusable workflow can only narrow what the caller
    # granted, so the grant belongs here where it is visible.
    permissions:
      contents: read
    # Renovate pins this to a digest on its next run, leaving `# v1` behind as
    # the record of what to follow -- the same shape as every other action pin
    # in these repos. See the repo README for what counts as breaking.
    uses: jcwearn/workflows/.github/workflows/public-sync.yaml@v1
    with:
      target-repo: jcwearn/<REPO>-public
      readme-override: .github/public-README.md
      # Committer identity for signed commits. The author comes from the
      # upstream commit; the committer is what GitHub verifies against, so this
      # must be an email tied to the account owning PUBLIC_SYNC_SIGNING_KEY.
      # Match it to the address your own commits are authored with and GitHub
      # renders them as one name instead of "X authored and X committed".
      signer-name: Jackson Wearn
      signer-email: 2472105+jcwearn@users.noreply.github.com
    secrets:
      DEPLOY_KEY: ${{ secrets.PUBLIC_SYNC_DEPLOY_KEY }}
      # Optional. Drop this line (and the signer-* inputs) to push unsigned.
      SIGNING_KEY: ${{ secrets.PUBLIC_SYNC_SIGNING_KEY }}
