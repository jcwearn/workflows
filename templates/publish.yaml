name: Publish Public Snapshot

# Copy to .github/workflows/publish.yaml in a private repo.
# Replace <REPO>-public with the target, and add the PUBLIC_SYNC_DEPLOY_KEY secret.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    uses: jcwearn/workflows/.github/workflows/public-sync.yaml@main
    with:
      target-repo: jcwearn/<REPO>-public
      readme-override: .github/public-README.md
      # Committer identity for signed commits. The author stays
      # github-actions[bot]; the committer is what GitHub verifies against, so
      # this must be an email tied to the account owning PUBLIC_SYNC_SIGNING_KEY.
      signer-name: Jackson Wearn
      signer-email: 2472105+jcwearn@users.noreply.github.com
    secrets:
      DEPLOY_KEY: ${{ secrets.PUBLIC_SYNC_DEPLOY_KEY }}
      # Optional. Drop this line (and the signer-* inputs) to push unsigned.
      SIGNING_KEY: ${{ secrets.PUBLIC_SYNC_SIGNING_KEY }}
